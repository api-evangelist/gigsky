name: GigSky
kind: company
description: GigSky is a global eSIM and mobile-data roaming platform offering travel
  and enterprise/IoT cellular connectivity across 190+ destinations. For business,
  enterprise, and IoT customers it provides the GigSky Enterprise Manager (GEM) and
  IoT SIM Management portal with RESTful APIs for eSIM provisioning, plan/catalog and
  connectivity management, orders, and usage controls. The partner/reseller and
  enterprise API surface is account-gated rather than publicly documented.
