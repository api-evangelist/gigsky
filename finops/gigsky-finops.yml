description: >-
  FinOps view of GigSky connectivity spend. GigSky bills consumer travel eSIM
  plans as prepaid purchases per destination, and enterprise/IoT connectivity on
  a pay-as-you-go and pooled-data basis with monthly statements via the GigSky
  Enterprise Manager (GEM). Partner/reseller and bulk pricing is sales-led.
  Because the API and pricing are account-gated and not publicly published,
  precise meters, rates, and billing dimensions are not reconciled here.
notes: >-
  Confirm billing model, meters, currency, and invoicing details against GigSky
  enterprise/partner agreements during reconciliation. Columns below reflect
  publicly observable structure only.
sources:
- https://www.gigsky.com/
