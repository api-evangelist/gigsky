meters:
- name: data_consumption
  description: >-
    Mobile data consumed per eSIM/SIM, billed via pay-as-you-go or against a
    pooled data plan. Unit and rate are account-specific and not publicly
    published.
  unit: data
  aggregation: sum
  dimensions:
  - account
  - esim
  - country
- name: plan_purchase
  description: >-
    Prepaid purchase of a regional/global eSIM data plan. Price varies by
    destination and allowance.
  unit: plans
  aggregation: sum
  dimensions:
  - account
  - plan
  - destination
principles:
- name: Visibility
  description: >-
    Use GEM monthly statements and per-SIM/sub-account usage reporting to inspect
    data consumption across teams and destinations.
- name: Allocation
  description: >-
    Map SIMs to user groups and sub-accounts to allocate connectivity spend to
    cost centers.
- name: Optimization
  description: >-
    Use pooled data across price zones and country-by-country limits to control
    roaming spend; right-size plans per destination.
- name: Accountability
  description: >-
    Assign owners per sub-account; review monthly statements against budget.
